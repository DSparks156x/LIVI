[package]
name = "livi-carpi"
description = "Bridge between livi-core and carpid, the car daemon of rnse-carpi"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
base64.workspace = true
# From the rnse-carpi superproject: this fork is its livi/ submodule.
carpi-proto = { path = "../../../../crates/carpi-proto" }
livi-aa-stack.workspace = true
livi-carpi-ui.workspace = true
livi-core-proto.workspace = true
livi-cp.workspace = true
livi-wifi.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["net", "io-util", "sync", "time", "macros", "rt", "process"] }

[dev-dependencies]
livi-aa-proto.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "test-util"] }
