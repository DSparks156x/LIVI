[package]
name = "livi-carpi"
description = "Bridge between livi-core and carpid, the car daemon of pq35-carpi"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
# From the pq35-carpi superproject: this fork is its livi/ submodule.
carpi-proto = { path = "../../../../crates/carpi-proto" }
livi-core-proto.workspace = true
livi-wifi.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["net", "io-util", "sync", "time", "macros", "rt", "process"] }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "test-util"] }
