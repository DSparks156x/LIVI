[package]
name = "livi-carpi"
description = "Bridge between livi-core and carpid, the car daemon of pq35-carpi"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
# The sibling pq35-carpi checkout. This path changes when the fork becomes a submodule of
# pq35-carpi.
carpi-proto = { path = "../../../../pq35-carpi/crates/carpi-proto" }
livi-core-proto.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["net", "io-util", "sync", "time", "macros", "rt"] }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "test-util"] }
